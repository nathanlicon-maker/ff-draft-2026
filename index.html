<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Draft Room</title>
<meta name="theme-color" content="#0C110D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root,[data-theme="dark"]{
  --bg:#0C110D;
  --p1:#141A15;
  --p2:#1B231C;
  --p3:#242E25;
  --line:#2B352C;
  --line-2:#1F281F;
  --tx:#EAEFE6;
  --dim:#909A8D;
  --faint:#6C776A;
  --chip:#0C110D;
  --av:#000000;
  --shadow:rgba(0,0,0,.5);
  --scrim:rgba(6,10,7,.78);
  --head:#B9E96C;
  --accent:#A9E635;
  --accent-2:#CBEF5A;
  --on-accent:#101A06;
  --pill:#1B231C;
  --pill-live-bg:rgba(169,230,53,.14);
  --pill-live-tx:#BFE96F;

  --t1:#FF6B6B; --t2:#FFA94D; --t3:#FFD93D; --t4:#8CE06B;
  --t5:#5AB4FF; --t6:#B48CFA; --t7:#7F8A80;
  --QB:#FF8763; --RB:#6EDB6E; --WR:#63AEF5; --TE:#C08CF5; --K:#F5C542; --DST:#98A79B;
  --live:#FF6B6B;
  --ok:#8CE06B;
}
[data-theme="light"]{
  --bg:#F2F6E9;
  --p1:#FFFFFF;
  --p2:#F7FAF0;
  --p3:#EBF0DF;
  --line:#E1E7D5;
  --line-2:#EDF1E4;
  --tx:#232821;
  --dim:#66705E;
  --faint:#6E7A66;
  --chip:#FFFFFF;
  --av:#FFFFFF;
  --shadow:rgba(60,72,48,.10);
  --scrim:rgba(45,55,38,.38);
  --head:#47701E;
  --accent:#A9E635;
  --accent-2:#C6EC50;
  --on-accent:#1E2E0B;
  --pill:#FFFFFF;
  --pill-live-bg:#F0FAD2;
  --pill-live-tx:#4C6F19;

  --t1:#D2453D; --t2:#BE6A16; --t3:#8F7605; --t4:#3D8B2E;
  --t5:#2168C4; --t6:#7048C9; --t7:#6C7669;
  --QB:#C04A28; --RB:#357C28; --WR:#2168C4; --TE:#7048C9; --K:#8A6208; --DST:#5E6B62;
  --live:#D2453D;
  --ok:#3D8B2E;
}
:root{
  --disp:'Archivo',system-ui,sans-serif;
  --ui:'Figtree',system-ui,sans-serif;
  --r:11px;
  --r-lg:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--tx);font-family:var(--ui);font-size:14px;line-height:1.45;transition:background .15s,color .15s;
  font-feature-settings:'tnum' 1,'cv05' 1;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--p3);border-radius:6px}
h1,h2,h3,h4{font-family:var(--disp);font-weight:800;letter-spacing:-.015em;line-height:1.06}
.sec h2,.mark h1{color:var(--head);text-transform:uppercase;letter-spacing:.005em}
.wrap{max-width:1580px;margin:0 auto;padding:0 18px 90px}

/* ---------- controls ---------- */
.btn{
  border:1px solid var(--line);background:var(--p1);color:var(--tx);padding:9px 15px;border-radius:var(--r);
  font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:7px;transition:background .12s,border-color .12s,filter .12s;white-space:nowrap;
}
.btn:hover{background:var(--p2);border-color:var(--dim)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.key{background:linear-gradient(100deg,var(--accent),var(--accent-2));color:var(--on-accent);border-color:transparent;font-weight:700}
.btn.key:hover{filter:brightness(1.06)}
.btn.warn:hover{border-color:var(--live);color:var(--live)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn.gh{background:transparent}
input[type=text],input[type=number],input[type=password],select,textarea{
  background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:10px 13px;color:var(--tx);width:100%;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--pill-live-bg)}
textarea{font-family:var(--ui);resize:vertical}
label.fl{display:block;font-size:12px;color:var(--dim);margin-bottom:5px}

.pos{
  font-size:10.5px;font-weight:700;padding:2px 5px;border-radius:3px;color:var(--chip);
  display:inline-block;line-height:1.35;letter-spacing:.01em;
}
.pos.QB{background:var(--QB)}.pos.RB{background:var(--RB)}.pos.WR{background:var(--WR)}
.pos.TE{background:var(--TE)}.pos.K{background:var(--K)}.pos.DST{background:var(--DST)}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:70;background:var(--bg);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hin{max-width:1580px;margin:0 auto;padding:10px 18px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.mark{min-width:0}
.mark h1{font-size:21px;font-weight:800;white-space:nowrap}
.mark .fmt{font-size:11.5px;color:var(--faint);margin-top:1px;white-space:nowrap}

.clockbar{display:flex;align-items:center;justify-content:center;gap:14px;min-width:0}
.otc{display:flex;align-items:center;gap:11px;padding:7px 16px;border:1px solid var(--line);border-radius:99px;background:var(--p1);min-width:0}
.otc.mine{border-color:var(--live);background:rgba(255,92,92,.09)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
.otc.live .dot{background:var(--live);box-shadow:0 0 10px var(--live);animation:bp 1.6s ease-in-out infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.3}}
.otc .who{min-width:0}
.otc .lb{font-size:10.5px;color:var(--dim)}
.otc .nm{font-family:var(--disp);font-weight:700;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(36vw,300px);line-height:1.1}
.pk{font-size:11px;color:var(--dim);padding-left:14px;border-left:1px solid var(--line);text-align:center;line-height:1.3}
.pk b{display:block;font-family:var(--disp);font-size:22px;font-weight:800;color:var(--tx)}
.tm{font-family:var(--disp);font-weight:700;font-size:25px;padding:2px 12px;border-radius:var(--r);border:1px solid var(--line);min-width:90px;text-align:center}
.tm.w{color:var(--t2);border-color:#6a4a1c}
.tm.c{color:var(--live);border-color:#6e2a2a;animation:bp .8s infinite}
.tm.off{color:var(--faint)}
.hact{display:flex;gap:7px;align-items:center;flex-wrap:wrap;justify-content:flex-end}

.sync{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--faint);padding:5px 11px;border:1px solid var(--line);background:var(--p1);border-radius:99px}
.sync .d{width:6px;height:6px;border-radius:50%;background:var(--faint)}
.sync.up .d{background:var(--accent)}
.sync.up{color:var(--dim)}
.sync.bad .d{background:var(--live)}
.sync.bad{color:var(--live)}

nav{max-width:1580px;margin:0 auto;padding:0 18px;display:flex;gap:1px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line-2)}
nav::-webkit-scrollbar{display:none}
nav button{font-size:13.5px;font-weight:600;color:var(--faint);padding:10px 15px;border-bottom:2px solid transparent;white-space:nowrap;transition:color .12s}
nav button:hover{color:var(--dim)}
nav button.on{color:var(--head);border-bottom-color:var(--accent);font-weight:700}
nav .n{font-size:11px;color:var(--faint);margin-left:5px}

/* ---------- ticker ---------- */
.tick{display:flex;gap:7px;overflow-x:auto;padding:11px 0;scrollbar-width:none;border-bottom:1px solid var(--line-2)}
.tick::-webkit-scrollbar{display:none}
.tk{flex:none;border:1px solid var(--line);border-radius:var(--r);padding:6px 10px;background:var(--p1);min-width:140px;position:relative;overflow:hidden}
.tk .e{position:absolute;left:0;top:0;bottom:0;width:2px}
.tk .a{font-size:10.5px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.tk .b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tk .c{font-size:11px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk.fresh{animation:land .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes land{0%{transform:scale(1.22);opacity:0}100%{transform:scale(1);opacity:1}}

/* ---------- draft layout ---------- */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-top:14px;align-items:start}
.phead{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:11px}
.sw{position:relative;flex:1;min-width:190px}
.sw input{padding-left:31px;height:38px}
.sw .i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fl-row{display:flex;gap:3px;flex-wrap:wrap}
.fl-row button{font-size:12.5px;font-weight:600;padding:8px 13px;border-radius:99px;border:1px solid var(--line);background:var(--p1);color:var(--dim)}
.fl-row button:hover{color:var(--tx)}
.fl-row button.on{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}

.pool{max-height:calc(100vh - 268px);overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--p1);box-shadow:0 1px 2px var(--shadow)}
.pr{display:grid;grid-template-columns:38px 1fr 44px 58px 46px 30px;gap:10px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-2);cursor:pointer}
.pr:last-child{border-bottom:none}
.pr:hover{background:var(--p2)}
.pr.sel{background:var(--p3);box-shadow:inset 3px 0 0 var(--tx)}
.pr .rk{font-size:12px;color:var(--faint);text-align:right}
.pr .nm{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pr .sub{font-size:11px;color:var(--faint)}
.pr .by{font-size:11.5px;color:var(--dim);text-align:center}
.pr .by.hit{color:var(--t2)}
.pr .tr{font-size:11px;font-weight:600;text-align:center;padding:2px 0;border-radius:3px}
.pr .st{opacity:0;color:var(--faint);text-align:center}
.pr:hover .st,.pr .st.on{opacity:1}
.pr .st.on{color:var(--t3)}
.pr.no{opacity:.32}
.empty{padding:36px 20px;text-align:center;color:var(--faint)}

/* ---------- right rail ---------- */
.rail{display:flex;flex-direction:column;gap:12px;position:sticky;top:116px}
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r-lg);padding:15px;box-shadow:0 1px 2px var(--shadow)}
.card h3{font-size:14px;font-weight:700;color:var(--dim);margin-bottom:10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--ui);font-size:11.5px;font-weight:400;color:var(--faint)}
.slots{display:flex;flex-direction:column;gap:3px}
.sl{display:grid;grid-template-columns:42px 1fr auto;gap:8px;align-items:center;padding:5px 8px;border-radius:5px;background:var(--p2);font-size:12.5px}
.sl.open{background:transparent;border:1px dashed var(--line)}
.sl .k{font-size:11px;color:var(--faint)}
.sl .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.sl.open .v{color:var(--faint)}
.sl .b{font-size:11px;color:var(--faint)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);background:var(--p1);color:var(--dim)}
.chip.hot{border-color:var(--live);color:var(--live)}
.chip.done{opacity:.35}
.note{margin-top:10px;padding:8px 10px;border-radius:var(--r);font-size:12px;background:var(--p2);border:1px solid var(--line);color:var(--dim)}
.note.hot{border-color:#6e2a2a;color:var(--t2);background:rgba(255,92,92,.06)}
.qn{display:grid;grid-template-columns:56px 1fr auto;gap:8px;font-size:12.5px;align-items:center;padding:3px 0}
.qn .p{font-size:11px;color:var(--faint)}
.qn .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qn.you .n{font-weight:700}
.qn .on{font-size:10px;color:var(--ok)}
.ba{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;font-size:12.5px;cursor:pointer;padding:4px 5px;border-radius:5px}
.ba:hover{background:var(--p2)}
.ba .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ba .r{font-size:11px;color:var(--faint)}

/* ---------- big board ---------- */
.bwrap{margin-top:14px}
.leg{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:12px;font-size:11.5px;color:var(--faint)}
.leg .l{display:flex;align-items:center;gap:5px}
.leg .s{width:9px;height:9px;border-radius:2px}
.bscroll{overflow-x:auto;padding-bottom:8px}
.bb{min-width:960px}
.brow{display:grid;grid-template-columns:40px repeat(var(--tc2),minmax(0,1fr));gap:4px;margin-bottom:4px}
.bhdr .th{font-size:12px;font-weight:600;text-align:center;color:var(--dim);padding:6px 4px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bhdr .th .s2{display:block;font-size:10.5px;color:var(--faint);font-weight:400}
.rn{font-family:var(--disp);font-weight:800;font-size:17px;color:var(--faint);display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1}
.rn .d{font-size:10px;font-weight:400;opacity:.7}
.cl{background:var(--p1);border:1px solid var(--line-2);border-radius:10px;padding:6px 8px;min-height:50px;position:relative;overflow:hidden}
.cl.live{border-color:var(--live);background:rgba(255,92,92,.08);box-shadow:0 0 0 1px var(--live)}
.cl.live::after{content:'on the clock';position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:9.5px;color:var(--live)}
.cl.fut{opacity:.4}
.cl.has{cursor:pointer}
.cl.has:hover{border-color:var(--faint)}
.cl .e{position:absolute;left:0;top:0;bottom:0;width:3px}
.cl .n{position:absolute;top:4px;right:6px;font-size:9.5px;color:var(--faint)}
.cl .nm{font-size:12px;font-weight:600;line-height:1.2;padding-right:18px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cl .mt{font-size:10px;color:var(--faint);margin-top:3px}
.cl.new{animation:land .5s cubic-bezier(.2,1.4,.4,1)}

/* ---------- rosters / setup ---------- */
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:13px;margin-top:16px}
.tc .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.tc .h h4{font-size:18px;font-weight:800}
.tc .h .ow{font-size:11px;color:var(--faint);display:block;margin-top:2px}
.tc .h .sn{font-size:11px;color:var(--faint)}
.byes{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px;padding-top:9px;border-top:1px solid var(--line-2)}

.setup{max-width:920px;margin:18px auto 0;display:flex;flex-direction:column;gap:14px}
.sec{padding:18px}
.sec h2{font-size:20px;font-weight:800;margin-bottom:4px}
.sec .h{font-size:13px;color:var(--dim);margin-bottom:15px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:13px}
.trow{display:grid;grid-template-columns:32px 1fr 1fr auto auto;gap:9px;align-items:center;margin-bottom:7px}
.trow .no{font-family:var(--disp);font-weight:800;font-size:18px;text-align:center;background:var(--p2);border-radius:var(--r);padding:6px 0;line-height:1}
.trow .mv{display:flex;gap:2px}
.trow .mv button{color:var(--faint);padding:5px 6px;border-radius:3px}
.trow .mv button:hover{background:var(--p2);color:var(--tx)}
.trow .cl2{font-size:11px;color:var(--ok);white-space:nowrap}
.roll{animation:rl .4s ease}
@keyframes rl{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}

.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:13px;margin-top:16px}
.sb h4{font-size:16px;font-weight:800;margin-bottom:9px}
.ln{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid var(--line-2);font-size:12.5px}
.ln:last-child{border:none}
.ln .v{font-weight:600}
.ln .v.neg{color:var(--live)}
.prose{font-size:13px;line-height:1.6;color:var(--dim);max-width:74ch}
.prose b{color:var(--tx)}
.prose ul{margin:8px 0 0 18px}
.prose li{margin-bottom:6px}

/* ---------- modal / toast ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal{background:var(--p1);border:1px solid var(--line);border-radius:var(--r-lg);max-width:490px;width:100%;padding:22px;max-height:88vh;overflow-y:auto}
.modal h3{font-size:21px;font-weight:800;margin-bottom:6px}
.modal p{font-size:13px;color:var(--dim);margin-bottom:15px}
.modal .row{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.pcard{border:1px solid var(--line);border-radius:var(--r);padding:13px;background:var(--p2)}
.pcard .n{font-family:var(--disp);font-weight:800;font-size:25px;line-height:1.05}
.pcard .m{font-size:12px;color:var(--dim);margin-top:5px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--p1);border:1px solid var(--line);border-radius:99px;padding:9px 20px;font-size:13px;box-shadow:0 10px 34px var(--shadow);animation:up .28s ease}
@keyframes up{from{transform:translate(-50%,12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.toast.bad{border-color:var(--live);color:var(--live)}
.stat{padding:14px}
.stat .k{font-size:11.5px;color:var(--faint)}
.stat .v{font-family:var(--disp);font-weight:800;font-size:31px;line-height:1.05;margin-top:3px}
.stat .d{font-size:12px;color:var(--dim);margin-top:3px}
.recap{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}


/* ---------- player avatars ---------- */
.av{
  width:34px;height:34px;border-radius:50%;flex:none;position:relative;overflow:hidden;
  background:var(--av);display:flex;align-items:center;justify-content:center;
}
.av img{width:100%;height:100%;object-fit:cover;display:block;background:var(--av)}
.av img.logo{object-fit:contain;padding:4px;background:var(--av)}
.av .mono{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.01em}
.av.sm{width:26px;height:26px}
.av.sm .mono{font-size:10.5px}
.av.lg{width:56px;height:56px}
.av.lg .mono{font-size:20px}
.av .ring{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--pc,transparent)}
.pr{grid-template-columns:34px 40px 1fr 46px 62px 30px}
.pc .av{margin-right:1px}
.cl .av{position:absolute;right:5px;bottom:5px;width:22px;height:22px;opacity:.9}
.cl .nm{padding-right:26px}

/* ---------- mock draft ---------- */
.mockbar{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:9px 14px;border:1px solid var(--t5);border-radius:9px;
  background:color-mix(in srgb,var(--t5) 10%,transparent);margin-top:13px;
}
.mockbar .lbl{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--t5)}
.mockbar .txt{font-size:12.5px;color:var(--dim);flex:1;min-width:150px}
.thinking{display:inline-flex;gap:3px;align-items:center;margin-left:6px}
.thinking i{width:4px;height:4px;border-radius:50%;background:var(--t5);animation:th 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}
.thinking i:nth-child(3){animation-delay:.3s}
@keyframes th{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- PLAYER PHOTOS ----------
   Three layers, each falling back to the next, so a face never
   becomes a broken image:
     1. headshot, if we have an id for that player
     2. their NFL team logo
     3. initials on the position colour
   The id lookup is fetched once in the background and cached, so
   the board is usable immediately and photos fill in as they load. */
const HEAD = {};                 // player name -> headshot id
let headsReady = false;
const TEAMLOGO = t => 'https://a.espncdn.com/i/teamlogos/nfl/500/'+String(t||'').toLowerCase()+'.png';
const HEADSHOT = id => 'https://sleepercdn.com/content/nfl/players/'+id+'.jpg';

function keyName(n){ return String(n||'').toLowerCase().replace(/[^a-z]/g,''); }
function initials(n){
  const p=String(n||'').replace(/[^A-Za-z ]/g,'').trim().split(/\s+/);
  if(!p.length) return '?';
  return (p.length>1 ? p[0][0]+p[p.length-1][0] : p[0].slice(0,2)).toUpperCase();
}
function avatar(pl, size){
  if(!pl) return '';
  const cls='av'+(size?' '+size:'');
  // no filled circle: the photo or logo sits on the page colour, and the
  // initials fallback carries the position colour as text
  const mono='<span class="mono" style="color:var(--'+pl.pos+')">'+esc(initials(pl.name))+'</span>';
  if(pl.pos==='DST'){
    return '<span class="'+cls+'">'+mono+
      '<img class="logo" src="'+TEAMLOGO(pl.team)+'" alt="" loading="lazy" style="position:absolute;inset:0" '+
      'onerror="this.remove()">'+'</span>';
  }
  const id = HEAD[keyName(pl.name)];
  if(id){
    return '<span class="'+cls+'">'+mono+
      '<img src="'+HEADSHOT(id)+'" alt="" loading="lazy" style="position:absolute;inset:0" '+
      'onerror="this.onerror=null;this.className=\'logo\';this.src=\''+TEAMLOGO(pl.team)+'\';">'+
      '</span>';
  }
  return '<span class="'+cls+'">'+mono+
    '<img class="logo" src="'+TEAMLOGO(pl.team)+'" alt="" loading="lazy" style="position:absolute;inset:0" '+
    'onerror="this.remove()">'+'</span>';
}
/* One request does two jobs: it supplies the headshot ids and the rest
   of the league. Cached afterwards, so it only happens once per device. */
function loadRoster(){
  try{
    const cached=get(LS+'_roster');
    if(cached){
      const c=JSON.parse(cached);
      Object.assign(HEAD,c.h||{});
      (c.x||[]).forEach(r=>POOL.push({name:r[0],pos:r[1],team:r[2],bye:r[3]}));
      reindexPool(); poolExtended=true; headsReady=true;
      return;
    }
  }catch(e){}
  reindexPool();
  if(typeof fetch!=='function') return;
  fetch('https://api.sleeper.app/v1/players/nfl').then(r=>r.json()).then(all=>{
    const before=POOL.length;
    extendPool(all);
    headsReady=true;
    try{
      const x=POOL.slice(before).map(p=>[p.name,p.pos,p.team,p.bye]);
      put(LS+'_roster', JSON.stringify({h:HEAD, x:x}));
    }catch(e){}
    render();
    toast(POOL.length+' players available');
  }).catch(()=>{ /* the ranked core still works on its own */ });
}

function toast(m,bad){
  const o=document.querySelector('.toast'); if(o) o.remove();
  const e=document.createElement('div'); e.className='toast'+(bad?' bad':''); e.textContent=m;
  document.body.appendChild(e);
  setTimeout(()=>{e.style.opacity='0';e.style.transition='opacity .25s';setTimeout(()=>e.remove(),260);},2200);
}
let ac=null;
function ping(f,d,v){
  try{ if(!ac) ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f; g.gain.setValueAtTime(v||.08,ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);
  }catch(e){}
}
function uid(){ return Math.random().toString(36).slice(2,10); }

function parsePool(t){
  const out=[];
  t.trim().split(/\r?\n/).forEach(l=>{
    const p=l.split('|').map(x=>x.trim());
    if(p.length<3||!p[0]) return;
    let pos=p[1].toUpperCase().replace(/[^A-Z]/g,'');
    if(pos==='DEF'||pos==='DEFENSE') pos='DST';
    if(!POSITIONS.includes(pos)) return;
    out.push({name:p[0],pos:pos,team:(p[2]||'FA').toUpperCase(),bye:parseInt(p[3],10)||0});
  });
  const c={};
  out.forEach((p,i)=>{ p.id=i; p.rank=i+1; c[p.pos]=(c[p.pos]||0)+1; p.posRank=c[p.pos]; });
  return out;
}

/* ---------- PLAYER POOL, FULL LEAGUE ----------
   The list above is the ranked core: consensus order for the players
   who actually go in the first fifteen rounds. Everyone else on an NFL
   roster gets appended after it so nobody is undraftable, ordered by
   how much fantasy interest they draw.

   The core keeps its order no matter what, so a pick made before the
   extra names arrive still points at the right player. */
const NAMEIDX = {};                 // "name|POS" -> pool index
const TEAMBYE = {};                 // NFL team -> bye week
let poolExtended = false;

/* There is exactly one defense per NFL team, and the sources name them
   differently ("Denver D/ST" vs "DEN D/ST"), so match those on the team
   instead of the name or every defense lands on the board twice. */
function dkey(pos,name,team){
  return pos==='DST' ? ('DST|'+(team||'')) : (keyName(name)+'|'+pos);
}
function reindexPool(){
  const c={};
  POOL.forEach((p,i)=>{
    p.id=i; p.rank=i+1;
    c[p.pos]=(c[p.pos]||0)+1; p.posRank=c[p.pos];
    NAMEIDX[dkey(p.pos,p.name,p.team)]=i;
    if(p.bye && p.team) TEAMBYE[p.team]=p.bye;
  });
}
const SLEEPER_POS = {QB:'QB',RB:'RB',WR:'WR',TE:'TE',K:'K',DEF:'DST'};

function extendPool(all){
  if(!all){ reindexPool(); return; }
  const have={};
  POOL.forEach(p=>{ have[dkey(p.pos,p.name,p.team)]=1; });
  reindexPool();                                     // fills TEAMBYE from the core
  const extra=[];
  Object.keys(all).forEach(id=>{
    const s=all[id];
    if(!s) return;
    const pos=SLEEPER_POS[s.position];
    if(!pos) return;
    if(!s.team) return;                              // must be on a roster
    if(s.active===false) return;
    const name = pos==='DST' ? (s.team+' D/ST') : (s.full_name || ((s.first_name||'')+' '+(s.last_name||'')).trim());
    if(!name) return;
    const k=dkey(pos,name,s.team);
    if(have[k]) return;
    have[k]=1;
    extra.push({
      name:name, pos:pos, team:s.team,
      bye:TEAMBYE[s.team]||0,
      _rk:(typeof s.search_rank==='number' && s.search_rank>0) ? s.search_rank : 999999,
      _id:id
    });
  });
  // most fantasy-relevant first, then alphabetical so every device agrees
  extra.sort((x,y)=> x._rk!==y._rk ? x._rk-y._rk : (x.name<y.name?-1:1));
  extra.forEach(e=>{
    if(e._id && e.pos!=='DST') HEAD[keyName(e.name)]=e._id;
    POOL.push({name:e.name,pos:e.pos,team:e.team,bye:e.bye});
  });
  reindexPool();
  poolExtended=true;
}

/* ---------- 5. SNAKE MATH ---------- */
const T = () => S.teams.length;
const roundOf = o => Math.floor(o/T())+1;
const slotOf  = o => (roundOf(o)%2===1) ? (o%T())+1 : T()-(o%T());
const teamAt  = o => S.order[slotOf(o)-1];
const totalPicks = () => S.rounds*T();
const atPick = () => S.picks.length;
const over = () => atPick() >= totalPicks();
const code = o => roundOf(o)+'.'+String(slotOf(o)).padStart(2,'0');

/* ---------- 6. DERIVED ---------- */
/* A pick carries the player's own details, not just a pool index.
   The pool can grow (or a device can load it late) without pick 118
   suddenly resolving to a different player on someone else's screen.
   Older picks that only stored an index still resolve, because the
   ranked core of the pool never changes order. */
function playerOf(p){
  if(!p) return null;
  if(p.custom) return Object.assign({id:-1,rank:9999,posRank:0},p.custom);
  if(p.n) return {id:(p.pid===undefined?-1:p.pid), name:p.n, pos:p.p, team:p.t||'FA',
                  bye:p.b||0, rank:p.r||9999, posRank:p.pr||0};
  return POOL[p.pid]||null;
}
function takenSet(){
  const s=new Set();
  S.picks.forEach(pk=>{
    const pl=playerOf(pk);
    if(!pl) return;
    if(pk.pid!==undefined && pk.pid>=0) s.add(pk.pid);
    const byName=NAMEIDX[dkey(pl.pos,pl.name,pl.team)];
    if(byName!==undefined) s.add(byName);
  });
  return s;
}
function rosterOf(t){
  const r=[]; S.picks.forEach((p,i)=>{ if(teamAt(i)===t){ const pl=playerOf(p); if(pl) r.push(Object.assign({},pl,{at:i})); } });
  return r;
}
const posCount = (t,pos) => rosterOf(t).filter(p=>p.pos===pos).length;
function canTake(t,pos){
  const r=rosterOf(t);
  if(r.length>=ROSTER) return {ok:false,why:'This roster is full'};
  if(posCount(t,pos)>=LIMITS[pos]) return {ok:false,why:'Already has '+LIMITS[pos]+' at '+lab(pos)+', the league maximum'};
  return {ok:true};
}
function lineup(t){
  const ps=rosterOf(t).slice().sort((a,b)=>a.rank-b.rank), used=new Set();
  const st=STARTERS.map(s=>{
    const h=ps.find(p=>!used.has(p.at)&&s.ok.includes(p.pos));
    if(h) used.add(h.at);
    return {slot:s.slot,player:h||null};
  });
  return {starters:st,bench:ps.filter(p=>!used.has(p.at))};
}
function openStarters(t){
  const m={}; lineup(t).starters.forEach(s=>{ if(!s.player) m[s.slot]=(m[s.slot]||0)+1; });
  return m;
}
function picksLeft(t){ let n=0; for(let i=atPick();i<totalPicks();i++) if(teamAt(i)===t) n++; return n; }
function nextPickFor(t){ for(let i=atPick();i<totalPicks();i++) if(teamAt(i)===t) return i; return -1; }

function posRun(){
  const n=Math.min(8,S.picks.length); if(n<5) return null;
  const c={};
  S.picks.slice(-n).forEach(p=>{const pl=playerOf(p); if(pl) c[pl.pos]=(c[pl.pos]||0)+1;});
  let b=null; Object.keys(c).forEach(k=>{ if(!b||c[k]>c[b]) b=k; });
  return (b && c[b]>=Math.ceil(n*.6)) ? {pos:b,n:c[b],of:n} : null;
}

/* ---------- 7. IDENTITY ---------- */
function myDevice(){
  let d=get(LS+'_dev'); if(!d){ d=uid(); put(LS+'_dev',d); } return d;
}
/* Which team's roster this device wants to watch. Purely a local
   preference now: nobody is required to identify themselves. */
function myTeam(){
  const v=get(LS+'_myteam');
  if(v!==null && v!=='' && S.teams[+v]) return +v;
  const d=myDevice();
  for(const k in (S.claims||{})) if(S.claims[k] && S.claims[k].dev===d) return parseInt(k,10);
  return null;
}
function amCommish(){
  if(!Sync.on) return true;
  if(S.commish) return S.commish===myDevice();
  return get(LS+'_role_'+(Sync.room||'local'))==='commish';
}
function canIPick(){
  if(MOCK.on) return mockIsMyTurn();
  if(!Sync.on) return true;
  if(over()||!S.started) return false;
  if(S.openPick||amCommish()) return true;
  return myTeam()===teamAt(atPick());
}

/* ============================================================
   8. SYNC — Firebase Realtime Database
   The whole draft lives at drafts/{room}. Picks are stored by
   index so two people picking at once can't collide: writing
   pick N only succeeds if slot N is still empty.
   ============================================================ */
const Sync = {
  on:false, room:null, cfg:null, ref:null, app:null, status:'off', muted:false,

  ready(){ return typeof firebase!=='undefined' && firebase.database; },

  start(cfg, room, isCommish, cb){
    if(!this.ready()){ cb&&cb('Firebase did not load. Check the connection and refresh.'); return; }
    try{
      if(!this.app) this.app = firebase.initializeApp(cfg);
    }catch(e){
      try{ this.app = firebase.app(); }catch(e2){ cb&&cb('That configuration was rejected: '+e.message); return; }
    }
    let db;
    try{ db = firebase.database(); }
    catch(e){ cb&&cb('Could not reach the database. Make sure Realtime Database is created and databaseURL is in the config.'); return; }

    this.cfg=cfg; this.room=room; this.on=true;
    this.ref = db.ref('drafts/'+room);
    if(isCommish) put(LS+'_role_'+room,'commish');
    put(LS+'_cfg', JSON.stringify(cfg));
    put(LS+'_room', room);

    // connection state
    db.ref('.info/connected').on('value',s=>{
      Sync.status = s.val() ? 'up' : 'down';
      paintSync();
      if(s.val()){
        const pr = Sync.ref.child('here/'+myDevice());
        pr.onDisconnect().remove();
        pr.set({t:Date.now()});
      }
    });

    this.ref.on('value', snap=>{
      const v = snap.val();
      if(!v){ Sync.pushAll(); return; }
      applyRemote(v);
    }, err=>{
      Sync.status='bad'; paintSync();
      toast('Database refused the read. Check the rules allow access.',1);
    });

    /* Nobody has to be told they are the commissioner: the first
       device to open the room takes the role and it sticks. */
    this.ref.child('commish').transaction(cur => cur===null ? myDevice() : undefined);

    cb&&cb(null);
  },

  pushAll(){
    if(!this.on||MOCK.on||!this.ref) return;
    const picks={}; S.picks.forEach((p,i)=>picks[i]=p);
    this.ref.set({
      meta:{league:S.league,rounds:S.rounds,clockSec:S.clockSec,started:S.started,openPick:!!S.openPick},
      teams:S.teams, order:S.order, picks:picks, claims:S.claims||{}
    });
  },
  /* one write, not three — three separate writes each trigger a read-back,
     and the first read-back would overwrite the edit still being sent */
  pushMeta(){
    if(!this.on||MOCK.on||!this.ref) return;
    this.ref.update({
      meta:{league:S.league,rounds:S.rounds,clockSec:S.clockSec,started:S.started,openPick:!!S.openPick},
      teams:S.teams,
      order:S.order
    });
  },
  /* append pick N only if nobody else got there first */
  addPick(idx, data, done){
    if(!this.on||this===null||MOCK.on||!this.ref){ done(true); return; }
    this.ref.child('picks/'+idx).transaction(
      cur => cur===null ? data : undefined,
      (err, committed) => done(!err && committed)
    );
  },
  removePick(idx){ if(this.on&&!MOCK.on&&this.ref) this.ref.child('picks/'+idx).remove(); },
  setClaim(teamId, obj){
    if(!this.on||MOCK.on||!this.ref){ S.claims[teamId]=obj; saveLocal(); render(); return; }
    if(obj) this.ref.child('claims/'+teamId).set(obj); else this.ref.child('claims/'+teamId).remove();
  },
  leave(){
    if(this.ref){ try{ this.ref.off(); this.ref.child('here/'+myDevice()).remove(); }catch(e){} }
    this.on=false; this.room=null; this.ref=null; this.status='off';
    put(LS+'_room',''); paintSync();
  }
};

function applyRemote(v){
  if(MOCK.on) return;   // a practice run must not be disturbed by the real draft
  const m = v.meta||{};
  S.commish  = v.commish || null;
  S.league   = m.league || S.league;
  S.rounds   = m.rounds || S.rounds;
  S.clockSec = (m.clockSec===undefined? S.clockSec : m.clockSec);
  S.started  = !!m.started;
  S.openPick = (m.openPick===undefined) ? true : !!m.openPick;
  if(v.teams) S.teams = v.teams.map(t=>({name:t.name||'Team',owner:t.owner||''}));
  if(v.order) S.order = v.order.slice();
  S.claims = v.claims || {};

  const before = S.picks.length;
  const arr=[];
  if(v.picks){ Object.keys(v.picks).forEach(k=>{ arr[parseInt(k,10)] = v.picks[k]; }); }
  S.picks = arr.filter(x=>x!=null);

  if(S.picks.length > before){
    flash = S.picks.length-1;
    const pl = playerOf(S.picks[S.picks.length-1]);
    ping(760,.09);
    if(!Sync.muted && pl) toast(esc(S.teams[teamAt(S.picks.length-1)].name)+' took '+pl.name);
    resetClock(); if(S.started && !over() && S.clockSec>0) startClock();
  }
  saveLocal();
  render();
}

function paintSync(){
  const p=$('#syncPill'), t=$('#syncTxt'); if(!p) return;
  if(!Sync.on){ p.className='sync'; t.textContent='This device only'; return; }
  if(Sync.status==='up'){ p.className='sync up'; t.textContent='Room '+Sync.room; }
  else if(Sync.status==='bad'){ p.className='sync bad'; t.textContent='Blocked'; }
  else { p.className='sync'; t.textContent='Reconnecting'; }
}

function saveLocal(){ if(MOCK.on) return; try{ put(LS, JSON.stringify(S)); }catch(e){} }
function loadLocal(){ try{ const r=get(LS); if(r) return JSON.parse(r); }catch(e){} return null; }

/* ============================================================
   MOCK DRAFT — a practice run against simulated managers.
   Runs entirely in memory on this device. It never touches the
   shared room, so you can rehearse while a real draft is set up.
   ============================================================ */
const MOCK = {on:false, slot:1, speed:1200, timer:null, saved:null, log:[]};

/* Everything that writes to the database checks this. */
function liveSync(){ return Sync.on && !MOCK.on; }

function mockStart(slot, speed){
  MOCK.saved = S;                       // set the real board aside
  MOCK.on = true;
  MOCK.slot = slot;
  MOCK.speed = speed;
  MOCK.log = [];
  stopClock();
  const st = blank();
  st.league = 'Mock draft';
  st.teams = st.teams.map((t,i)=>({name: i===(slot-1)?'You':'Manager '+(i+1), owner:''}));
  st.order = st.teams.map((t,i)=>i);
  st.rounds = ROSTER;
  st.clockSec = 0;
  st.started = true;
  st.openPick = true;
  S = st;
  put(LS+'_myteam', String(slot-1));
  view='draft'; render();
  mockTick();
}
function mockStop(){
  if(!MOCK.on) return;
  MOCK.on=false;
  if(MOCK.timer){ clearTimeout(MOCK.timer); MOCK.timer=null; }
  S = MOCK.saved || blank();
  MOCK.saved=null;
  put(LS+'_myteam','');
  view='draft'; resetClock(); render();
  toast('Back on the real board');
}
function mockIsMyTurn(){ return MOCK.on && !over() && teamAt(atPick())===(MOCK.slot-1); }

/* How a simulated manager chooses. Best available, bent by what the
   roster still needs and by how real drafts actually flow: no kicker
   in round two, no fifth receiver before a starting tight end. */
function mockScore(p, team, roundNo){
  let s = 1000 - p.rank;
  const have = posCount(team,p.pos);
  const need = openStarters(team);
  const roundsLeft = S.rounds - roundNo + 1;

  if(!canTake(team,p.pos).ok) return -1e9;

  // kickers and defenses are last-two-rounds business
  if((p.pos==='K'||p.pos==='DST')){
    if(roundsLeft > 3) return -1e9;
    if(need[p.pos==='K'?'K':'D/ST']) s += 260;
    else return -1e9;
  }
  // fill starters before depth
  const startNeed = {QB:need['QB']||0, RB:need['RB']||0, WR:need['WR']||0, TE:need['TE']||0};
  if(startNeed[p.pos]) s += 130;
  if((p.pos==='RB'||p.pos==='WR'||p.pos==='TE') && (need['FLEX']||0)) s += 55;

  // one quarterback is plenty until late
  if(p.pos==='QB'){
    if(have>=1) s -= 400;
    else if(roundNo<=4) s -= 130;
  }
  if(p.pos==='TE' && have>=1) s -= 320;
  if(p.pos==='RB' && have>=5) s -= 200;
  if(p.pos==='WR' && have>=5) s -= 200;

  // a little noise so two runs are never identical
  s += (Math.random()*70 - 20);
  return s;
}
function mockPickFor(team){
  const tk=takenSet();
  const roundNo=roundOf(atPick());
  const pool=POOL.filter(p=>!tk.has(p.id)).slice(0,90);
  let best=null, bs=-Infinity;
  pool.forEach(p=>{ const s=mockScore(p,team,roundNo); if(s>bs){bs=s;best=p;} });
  if(!best){
    const any=POOL.find(p=>!tk.has(p.id)&&canTake(team,p.pos).ok);
    best=any||null;
  }
  return best;
}
function mockTick(){
  if(!MOCK.on) return;
  if(over()){ render(); toast('Mock draft finished'); return; }
  if(mockIsMyTurn()){ render(); return; }   // wait for the human
  MOCK.timer = setTimeout(()=>{
    if(!MOCK.on) return;
    const team=teamAt(atPick());
    const p=mockPickFor(team);
    if(!p){ MOCK.on=false; render(); return; }
    S.picks.push({pid:p.id, n:p.name, p:p.pos, t:p.team, b:p.bye||0, r:p.rank, pr:p.posRank, by:'cpu', at:Date.now()});
    flash=S.picks.length-1;
    render();
    mockTick();
  }, MOCK.speed);
}
/* After the human picks, hand control back to the simulated managers. */
function mockAfterHuman(){ if(MOCK.on) mockTick(); }

function resetClock(){ clock.left=S.clockSec; paintClock(); }
function startClock(){
  if(S.clockSec<=0||over()||!S.started) return;
  clock.run=true; if(clock.h) clearInterval(clock.h);
  clock.h=setInterval(()=>{
    clock.left--;
    if(clock.left===10) ping(640,.13);
    if(clock.left<=0){ clock.left=0; stopClock(); ping(300,.45,.14); toast('Clock expired'); }
    paintClock();
  },1000);
  paintClock();
}
function stopClock(){ clock.run=false; if(clock.h){clearInterval(clock.h);clock.h=null;} paintClock(); }
function paintClock(){
  const e=$('#tmr'); if(!e) return;
  if(S.clockSec<=0||!S.started||over()){ e.textContent='—:—'; e.className='tm off'; }
  else{
    e.textContent=Math.floor(clock.left/60)+':'+String(clock.left%60).padStart(2,'0');
    e.className='tm'+(clock.left<=10?' c':clock.left<=30?' w':'')+(clock.run?'':' off');
  }
  const b=$('#bClock'); if(b) b.textContent = clock.run?'Pause clock':'Start clock';
}

/* ---------- 10. PICK ACTIONS ---------- */
function makePick(pid, custom){
  if(over()){ toast('The draft is finished',1); return; }
  if(!S.started){ toast('Start the draft first',1); return; }
  if(!canIPick()){ toast('It is '+S.teams[teamAt(atPick())].name+"'s pick",1); return; }
  const idx=atPick(), t=teamAt(idx);
  const pl = custom || POOL[pid];
  if(!pl){ toast('Could not find that player',1); return; }
  const c=canTake(t,pl.pos);
  if(!c.ok){ toast(c.why,1); return; }
  if(!custom && takenSet().has(pid)){ toast('Already drafted',1); return; }

  const data = custom
    ? {custom:custom, by:myDevice(), at:Date.now()}
    : {pid:pid, n:pl.name, p:pl.pos, t:pl.team, b:pl.bye||0, r:pl.rank, pr:pl.posRank,
       by:myDevice(), at:Date.now()};

  Sync.addPick(idx, data, okd=>{
    if(!okd){ toast('Someone picked at the same moment. Try again.',1); return; }
    if(!liveSync()){
      S.picks.push(data); flash=idx; ping(820,.09);
      resetClock(); if(!over()&&S.clockSec>0) startClock(); else stopClock();
      if(!MOCK.on) saveLocal();
      render();
      if(MOCK.on) mockAfterHuman();
      else if(over()) toast('Draft complete');
    }
  });
}
function undo(){
  if(!S.picks.length){ toast('No picks to undo',1); return; }
  if(liveSync() && !amCommish()){ toast('Only the commissioner can undo',1); return; }
  const i=S.picks.length-1, pl=playerOf(S.picks[i]);
  if(liveSync()) Sync.removePick(i);
  else { S.picks.pop(); if(!MOCK.on) saveLocal(); render(); }
  flash=null; resetClock(); stopClock();
  toast('Removed '+(pl?pl.name:'the last pick'));
}
function dropPick(i){
  if(liveSync() && !amCommish()){ toast('Only the commissioner can change picks',1); return; }
  if(liveSync()){
    const rest = S.picks.slice(i+1);
    const obj={}; S.picks.slice(0,i).forEach((p,k)=>obj[k]=p);
    rest.forEach((p,k)=>obj[i+k]=p);
    Sync.ref.child('picks').set(obj);
  } else { S.picks.splice(i,1); if(!MOCK.on) saveLocal(); render(); }
  flash=null; toast('Pick removed, the rest moved up');
}

/* ---------- 13. VIEWS ---------- */
const TABS=[{k:'draft',l:'Draft'},{k:'board',l:'Board'},{k:'rosters',l:'Rosters'},{k:'setup',l:'Setup'},{k:'scoring',l:'Scoring'}];

function head(){
  $('#lgName').textContent = S.league||'Draft Room';
  $('#lgFmt').textContent = T()+' teams, snake, '+S.rounds+' rounds, half PPR';
  const o=atPick(), otc=$('#otc');

    $('#otcLbl').textContent='Not started'; $('#otcName').textContent='—';

}

function ticker(){
  if(!S.picks.length) return '';
  return '<div class="tick">'+S.picks.map((p,i)=>({p,i})).slice(-14).reverse().map(({p,i})=>{
    const pl=playerOf(p), t=S.teams[teamAt(i)];
    const d = pl.rank<9999 ? pl.rank-(i+1) : 0;
    return '<div class="tk'+(i===flash?' fresh':'')+'"><span class="e" style="background:var(--'+pl.pos+')"></span>'+
      '<div class="a"><span>'+code(i)+'</span><span>'+(d>=12?'+'+d:d<=-14?d:'')+'</span></div>'+
      '<div class="b">'+esc(pl.name)+'</div><div class="c">'+esc(t.name)+'</div></div>';
  }).join('')+'</div>';
}

function poolRows(){
  const o=atPick(), t=(S.started&&!over())?teamAt(o):null;
  const tk=takenSet(), q=query.trim().toLowerCase();
  let list=POOL.filter(p=>{
    if(tk.has(p.id)) return false;
    if(filterPos!=='ALL'&&p.pos!==filterPos) return false;
    if(q && !(p.name+' '+p.team+' '+lab(p.pos)).toLowerCase().includes(q)) return false;
    return true;
  });
  if(selIdx>=list.length) selIdx=0;
  if(!list.length) return {html:'<div class="empty">Nobody matches that search.</div>',list:list};
  const mt = myTeam();
  const byes={};
  if(mt!==null) lineup(mt).starters.forEach(s=>{ if(s.player&&s.player.bye) byes[s.player.bye]=(byes[s.player.bye]||0)+1; });
  const html = list.slice(0,280).map((p,i)=>{
    const bad = t!==null && !canTake(t,p.pos).ok;
    const d = p.rank-(o+1);
    return '<div class="pr'+(i===selIdx?' sel':'')+(bad?' no':'')+'" data-pid="'+p.id+'">'+
      '<span class="rk">'+p.rank+'</span>'+
      avatar(p)+
      '<div><div class="nm">'+esc(p.name)+'</div><div class="sub">'+esc(p.team)+'</div></div>'+
      '<span class="pos '+p.pos+'">'+lab(p.pos)+p.posRank+'</span>'+
      '<span class="by'+(byes[p.bye]>=2?' hit':'')+'">'+(p.bye?'Bye '+p.bye:'—')+'</span>'+
      '<span class="st"></span></div>';
  }).join('');
  return {html:html,list:list};
}

function draftView(){
  const o=atPick(), live=(S.started&&!over());
  const t = live?teamAt(o):null;
  const mt = myTeam();
  const focus = mt!==null ? mt : t;
  const pr=poolRows();
  const tk=takenSet();

  let rail='';
  if(focus!==null){
    const lu=lineup(focus), left=picksLeft(focus), miss=openStarters(focus);
    const need=Object.values(miss).reduce((a,b)=>a+b,0);
    const np=nextPickFor(focus);
    rail += '<div class="card"><h3>'+esc(S.teams[focus].name)+'<small>'+
      (mt===focus?'your team':'on the clock')+'</small></h3><div class="slots">'+
      lu.starters.map(s=>s.player
        ? '<div class="sl"><span class="k">'+s.slot+'</span><span class="v">'+esc(s.player.name)+'</span><span class="b">'+(s.player.bye||'')+'</span></div>'
        : '<div class="sl open"><span class="k">'+s.slot+'</span><span class="v">open</span><span class="b"></span></div>').join('')+
      lu.bench.map(p=>'<div class="sl"><span class="k">Bench</span><span class="v">'+esc(p.name)+'</span><span class="b">'+(p.bye||'')+'</span></div>').join('')+
      Array.from({length:Math.max(0,BENCH-lu.bench.length)}).map(()=>'<div class="sl open"><span class="k">Bench</span><span class="v">open</span><span class="b"></span></div>').join('')+
      '</div><div class="chips">'+POSITIONS.map(p=>{
        const c=posCount(focus,p);
        return '<span class="chip'+(c>=LIMITS[p]?' done':'')+'">'+lab(p)+' '+c+'</span>';
      }).join('')+'</div>'+
      (need>0&&left<=need?'<div class="note hot">'+left+' picks left and '+need+' starting spots still open: '+Object.keys(miss).join(', ')+'.</div>':'')+
      (np>=0&&np!==o?'<div class="note">Next pick at '+code(np)+', '+(np-o)+' away.</div>':'')+

  }

  if(!live) rail = '<div class="card"><h3>'+(over()?'Draft complete':'Not started')+'</h3><p style="font-size:13px;color:var(--dim)">'+
    (over()?'The full results are on the Rosters tab.':'Set your teams and order on the Setup tab, then start the draft.')+
    '</p><div style="margin-top:12px"><button class="btn key" data-go="'+(over()?'rosters':'setup')+'">'+(over()?'See rosters':'Go to setup')+'</button></div></div>';

  const turn = live && !canIPick();

    ? '<div class="mockbar"><span class="lbl">Practice run</span>'+
      '<span class="txt">'+(mockIsMyTurn()
        ? 'Your pick, round '+roundOf(o)+'.'

      '</span>'+
      '<select id="mkSpeed" style="width:auto"><option value="2200"'+(MOCK.speed==2200?' selected':'')+'>Slow</option>'+
      '<option value="1200"'+(MOCK.speed==1200?' selected':'')+'>Normal</option>'+
      '<option value="450"'+(MOCK.speed==450?' selected':'')+'>Fast</option>'+
      '<option value="80"'+(MOCK.speed==80?' selected':'')+'>Instant</option></select>'+
      '<button class="btn sm" id="mkEnd">End practice</button></div>'
    : '';

  const tk2=takenSet().size + S.picks.filter(p=>p.custom).length;
  const top='<div class="boardtop"><div><h2>Draft board</h2>'+
    '<div class="sub">Search a name and press Enter, or click a row to draft.</div></div>'+
    '<div class="counts">'+
    '<span class="cpill">'+POOL.length+' total</span>'+
    '<span class="cpill live">'+(POOL.length-takenSet().size)+' available</span>'+
    '<span class="cpill">'+S.picks.length+' drafted</span></div></div>';

  return top+ticker()+mockBar+'<div class="dgrid"><section>'+
    (turn?'<div class="note" style="margin-bottom:11px">Waiting on '+esc(S.teams[teamAt(o)].name)+'. You will be able to pick when your turn comes.</div>':'')+
    '<div class="phead"><div class="sw"><span class="i">⌕</span>'+
    '<input type="text" id="q" placeholder="Search a player, then press Enter to draft" value="'+esc(query)+'" autocomplete="off"></div>'+
    '<div class="fl-row">'+['ALL'].concat(POSITIONS).map(p=>'<button class="'+(filterPos===p?'on':'')+'" data-f="'+p+'">'+(p==='ALL'?'All':lab(p))+'</button>').join('')+'</div>'+
    '<button class="btn sm" id="bCustom">Add a player</button></div>'+
    '<div class="pool" id="pool">'+pr.html+'</div></section><aside class="rail">'+rail+'</aside></div>';
}

function boardView(){
  const cur=atPick();
  const hdr='<div class="brow bhdr"><div></div>'+S.order.map((tid,i)=>
    '<div class="th">'+esc(S.teams[tid].name)+'<span class="s2">Slot '+(i+1)+'</span></div>').join('')+'</div>';
  let out=hdr;
  for(let r=1;r<=S.rounds;r++){
    if(r>1&&(r-1)%5===0) out+=hdr;
    const fwd=r%2===1; let cells='';
    for(let c=1;c<=T();c++){
      const o = fwd ? (r-1)*T()+(c-1) : (r-1)*T()+(T()-c);
      const p=S.picks[o], pl=p?playerOf(p):null;
      const live=S.started&&o===cur&&!over();
      cells+='<div class="cl '+(pl?'has':live?'live':o>cur?'fut':'')+(o===flash?' new':'')+'" data-o="'+o+'"'+(pl?' data-ed="'+o+'"':'')+'>'+
        (pl?'<span class="e" style="background:var(--'+pl.pos+')"></span>':'')+
        '<span class="n">'+(o+1)+'</span>'+
        (pl?'<div class="nm">'+esc(pl.name)+'</div><div class="mt">'+lab(pl.pos)+' '+esc(pl.team)+' bye '+(pl.bye||'—')+'</div>'+avatar(pl,'sm'):'')+
        '</div>';
    }
    out+='<div class="brow"><div class="rn">'+r+'<span class="d">'+(fwd?'▸':'◂')+'</span></div>'+cells+'</div>';
  }
  return '<div class="bwrap"><div class="leg">'+POSITIONS.map(p=>
    '<span class="l"><span class="s" style="background:var(--'+p+')"></span>'+lab(p)+'</span>').join('')+
    '<span class="l" style="margin-left:auto">Odd rounds run left to right, even rounds run back.</span></div>'+
    '<div class="bscroll"><div class="bb" style="--tc2:'+T()+'">'+out+'</div></div></div>';
}

      lu.bench.map(p=>'<div class="sl"><span class="k">Bench</span><span class="v"><span class="pos '+p.pos+'">'+lab(p.pos)+'</span> '+esc(p.name)+'</span><span class="b">'+(p.bye||'')+'</span></div>').join('')+

    '<div class="row"><button class="btn" data-x>Cancel</button><button class="btn key" id="fGo">Create the room</button></div>');
  $('#fGo').onclick=()=>{
    const cfg=readCfg($('#fCfg').value);
    if(!cfg){ toast('Could not read that config',1); return; }
    if(!cfg.databaseURL){ toast('That config has no databaseURL. Create the Realtime Database first.',1); return; }
    const room=($('#fRoom').value||'DRAFT').toUpperCase().replace(/[^A-Z0-9]/g,'');
    closeM();
    Sync.start(cfg,room,true,err=>{
      if(err){ toast(err,1); return; }
      Sync.pushAll(); toast('Room '+room+' is live'); render();
    });
  };
}
function joinModal(){
  const saved=get(LS+'_cfg')||'';
  modal('<h3>Join a draft room</h3><p>Paste the same config your commissioner used, and the room code.</p>'+
    '<label class="fl">firebaseConfig</label><textarea id="jCfg" rows="6">'+esc(saved)+'</textarea>'+
    '<label class="fl" style="margin-top:11px">Room code</label><input type="text" id="jRoom" maxlength="12">'+
    '<div class="row"><button class="btn" data-x>Cancel</button><button class="btn key" id="jGo">Join</button></div>');
  $('#jGo').onclick=()=>{
    const cfg=readCfg($('#jCfg').value);
    if(!cfg){ toast('Could not read that config',1); return; }
    const room=($('#jRoom').value||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
    if(!room){ toast('Enter the room code',1); return; }
    closeM();
    Sync.start(cfg,room,false,err=>{ if(err){toast(err,1);return;} toast('Joined '+room); render(); });
  };
}
function readCfg(text){
  if(!text) return null;
  let t=text.trim();
  const b=t.indexOf('{'), e=t.lastIndexOf('}');
  if(b<0||e<0) return null;
  t=t.slice(b,e+1);
  try{ return JSON.parse(t); }catch(err){}
  try{
    const j=t.replace(/([{,]\s*)([A-Za-z0-9_]+)\s*:/g,'$1"$2":').replace(/'/g,'"').replace(/,(\s*})/g,'$1');
    return JSON.parse(j);
  }catch(err){ return null; }
}
function invite(){
  if(!Sync.on){ toast('Set up the shared room first',1); return; }
  // With the room baked into the file the plain address is all anyone needs.
  if(ROOM && ROOM.databaseURL){
    const plain=location.origin+location.pathname;
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(plain).then(()=>toast('Link copied')).catch(()=>showLink(plain));
    else showLink(plain);
    return;
  }
  const payload=btoa(unescape(encodeURIComponent(JSON.stringify({c:Sync.cfg,r:Sync.room}))))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const url=location.origin+location.pathname+'#j='+payload;
  const done=()=>toast('Invite link copied');
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done).catch(()=>showLink(url));
  else showLink(url);
}
function showLink(u){
  modal('<h3>Invite link</h3><p>Send this to the other managers. It connects them to the room automatically.</p>'+
    '<textarea rows="4" readonly onclick="this.select()">'+esc(u)+'</textarea>'+
    '<div class="row"><button class="btn" data-x>Close</button></div>');
}

function exportCSV(){
  const rows=[['Overall','Round','Slot','Team','Manager','Player','Position','NFL','Bye','Rank']];
  S.picks.forEach((p,i)=>{
    const pl=playerOf(p), t=S.teams[teamAt(i)];
    rows.push([i+1,roundOf(i),slotOf(i),t.name,t.owner||'',pl.name,lab(pl.pos),pl.team,pl.bye||'',pl.rank<9999?pl.rank:'']);
  });
  const csv=rows.map(r=>r.map(c=>/[",\n]/.test(String(c))?'"'+String(c).replace(/"/g,'""')+'"':c).join(',')).join('\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  a.download=(S.league||'draft').replace(/[^\w]+/g,'_')+'.csv'; a.click();
  toast('Results downloaded');
}

/* ---------- 15. RENDER + BIND ---------- */
/* Remote picks land at any moment and re-render the page. If someone is
   part-way through typing a team name or a search, put them back where
   they were instead of yanking the field out from under them. */
function keepFocus(){
  const a=document.activeElement;
  if(!a||!$('#main').contains(a)) return null;
  if(!['INPUT','TEXTAREA'].includes(a.tagName)) return null;
  const key = a.id ? '#'+a.id
    : a.dataset.nm!==undefined ? '[data-nm="'+a.dataset.nm+'"]'
    : a.dataset.ow!==undefined ? '[data-ow="'+a.dataset.ow+'"]'
    : null;
  if(!key) return null;
  return {key:key, s:a.selectionStart, e:a.selectionEnd, v:a.value};
}
function putFocus(f){
  if(!f) return;
  const el=$(f.key); if(!el) return;
  if(el.value!==f.v) el.value=f.v;
  el.focus();
  try{ el.setSelectionRange(f.s,f.e); }catch(e){}
}
function render(){
  const f=keepFocus();
  head();
  const m=$('#main');
  if(view==='draft') m.innerHTML=draftView();
  else if(view==='board') m.innerHTML=boardView();
  else if(view==='rosters') m.innerHTML=rostersView();
  else if(view==='setup') m.innerHTML=setupView();
  else m.innerHTML=scoringView();
  bind();
  putFocus(f);
  flash=null;
}

function bindRows(){
  $$('.pr[data-pid]').forEach(r=>r.onclick=()=>confirmPick(+r.dataset.pid));
  $$('.ba[data-pid]').forEach(r=>r.onclick=()=>confirmPick(+r.dataset.pid));
}

function bind(){
  const m=$('#main');
  $$('[data-go]').forEach(b=>b.onclick=()=>{view=b.dataset.go;render();});

  const q=$('#q');
  if(q){
    q.oninput=e=>{ query=e.target.value; selIdx=0; const p=$('#pool'); p.innerHTML=poolRows().html; bindRows(); };
    q.onkeydown=e=>{
      const list=poolRows().list;
      if(e.key==='Enter'){ e.preventDefault(); if(list[selIdx]) confirmPick(list[selIdx].id); }
      else if(e.key==='ArrowDown'){ e.preventDefault(); selIdx=Math.min(selIdx+1,list.length-1); mark(); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); selIdx=Math.max(0,selIdx-1); mark(); }
    };
    if(view==='draft'&&S.started&&!over()&&canIPick()) setTimeout(()=>q.focus(),40);
  }
  $$('[data-f]').forEach(b=>b.onclick=()=>{filterPos=b.dataset.f;selIdx=0;render();});
  const bc=$('#bCustom'); if(bc) bc.onclick=customModal;
  bindRows();

  // board
  $$('[data-ed]').forEach(c=>c.onclick=()=>{
    const o=+c.dataset.ed, pl=playerOf(S.picks[o]);
    modal('<h3>Pick '+(o+1)+'</h3><p>'+esc(S.teams[teamAt(o)].name)+', round '+roundOf(o)+'</p>'+
      '<div class="pcard"><div class="n">'+esc(pl.name)+'</div><div class="m">'+lab(pl.pos)+' '+esc(pl.team)+'</div></div>'+
      '<p style="margin-top:14px">Removing this shifts every later pick up one. Use it to fix a wrong name, then redraft from the top.</p>'+
      '<div class="row"><button class="btn" data-x>Leave it</button><button class="btn warn" id="rm">Remove this pick</button></div>');
    $('#rm').onclick=()=>{closeM();dropPick(o);};
  });

  const e1=$('#eCSV'); if(e1) e1.onclick=exportCSV;
  const e2=$('#eCSV2'); if(e2) e2.onclick=exportCSV;

  // setup
  const sn=$('#sName'); if(sn) sn.oninput=e=>{S.league=e.target.value;$('#lgName').textContent=e.target.value||'Draft Room';saveLocal();};
  if(sn) sn.onchange=()=>{ if(Sync.on&&amCommish()) Sync.pushMeta(); };
  const sr=$('#sRounds'); if(sr) sr.onchange=e=>{S.rounds=Math.max(1,Math.min(25,parseInt(e.target.value,10)||ROSTER));saveLocal();if(Sync.on)Sync.pushMeta();render();};
  const sc=$('#sClock'); if(sc) sc.onchange=e=>{S.clockSec=Math.max(0,parseInt(e.target.value,10)||0);resetClock();saveLocal();if(Sync.on)Sync.pushMeta();};
  $$('[data-nm]').forEach(i=>{ i.oninput=e=>{S.teams[+i.dataset.nm].name=e.target.value;saveLocal();head();};
    i.onchange=()=>{ if(Sync.on&&amCommish()) Sync.pushMeta(); }; });
  $$('[data-ow]').forEach(i=>{ i.oninput=e=>{S.teams[+i.dataset.ow].owner=e.target.value;saveLocal();};
    i.onchange=()=>{ if(Sync.on&&amCommish()) Sync.pushMeta(); }; });
  $$('[data-up]').forEach(b=>b.onclick=()=>{const i=+b.dataset.up;const o=S.order;[o[i-1],o[i]]=[o[i],o[i-1]];saveLocal();if(Sync.on)Sync.pushMeta();render();});
  $$('[data-dn]').forEach(b=>b.onclick=()=>{const i=+b.dataset.dn;const o=S.order;[o[i+1],o[i]]=[o[i],o[i+1]];saveLocal();if(Sync.on)Sync.pushMeta();render();});
  const br=$('#bRand'); if(br) br.onclick=()=>{
    for(let i=S.order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[S.order[i],S.order[j]]=[S.order[j],S.order[i]];}
    saveLocal(); if(Sync.on)Sync.pushMeta(); render(); ping(520,.12);
    $$('.trow').forEach((r,i)=>{r.classList.add('roll');r.style.animationDelay=(i*40)+'ms';});
    toast('Order set');
  };
  const ba=$('#bAdd'); if(ba) ba.onclick=()=>{ if(T()>=16){toast('Sixteen is the most',1);return;} S.teams.push({name:'Team '+(T()+1),owner:''}); S.order.push(T()-1); saveLocal(); if(Sync.on)Sync.pushMeta(); render(); };
  const bs=$('#bSub'); if(bs) bs.onclick=()=>{ if(T()<=2){toast('Need at least two',1);return;} const id=T()-1; S.teams.pop(); S.order=S.order.filter(x=>x!==id); saveLocal(); if(Sync.on)Sync.pushMeta(); render(); };
  const bi=$('#bImport'); if(bi) bi.onclick=importModal;
  const bpr=$('#bPoolReset'); if(bpr) bpr.onclick=()=>{ S.poolText=null; POOL=parsePool(DEFAULT_POOL); extendPool(); saveLocal(); render(); toast('Built-in list restored'); };
  const bst=$('#bStart'); if(bst) bst.onclick=()=>{
    S.started=true; view='draft'; resetClock(); saveLocal();
    if(Sync.on) Sync.pushMeta();
    render(); if(S.clockSec>0) startClock(); ping(700,.1);
    toast(S.teams[teamAt(0)].name+' is on the clock');
  };
  const bb=$('#bBack'); if(bb) bb.onclick=()=>{view='draft';render();};
  const bcl=$('#bClear'); if(bcl) bcl.onclick=()=>{
    modal('<h3>Clear the board?</h3><p>Every pick is removed and the draft returns to setup. Team names and order stay.</p>'+
      '<div class="row"><button class="btn" data-x>Keep it</button><button class="btn warn" id="cg">Clear everything</button></div>');
    $('#cg').onclick=()=>{
      S.picks=[]; S.started=false; stopClock(); closeM(); view='setup';
      if(Sync.on){ Sync.ref.child('picks').remove(); Sync.pushMeta(); } else { saveLocal(); render(); }
    };
  };
  const bcr=$('#bCreate'); if(bcr) bcr.onclick=()=>{ if(MOCK.on) mockStop(); setupRoomModal(); };
  const bjn=$('#bJoin'); if(bjn) bjn.onclick=joinModal;
  // practice run
  const mkg=$('#mkGo'); if(mkg) mkg.onclick=()=>{
    const slot=+($('#mkSlot').value||1), sp=+($('#mkSpeed2').value||1200);
    mockStart(slot,sp);
    toast('Practice draft started, you are slot '+slot);
  };
  const mke=$('#mkEnd'); if(mke) mke.onclick=mockStop;
  const mks=$('#mkSpeed'); if(mks) mks.onchange=e=>{ MOCK.speed=+e.target.value; };

  // appearance
  const td=$('#thDark'); if(td) td.onclick=()=>applyTheme('dark');
  const tl=$('#thLight'); if(tl) tl.onclick=()=>applyTheme('light');
  const ph=$('#phOn'); if(ph) ph.onchange=e=>{
    if(e.target.checked){ put(LS+'_photos','on'); toast('Photos on'); }
    else { put(LS+'_photos','off'); toast('Photos off, showing team logos'); }
    render();
  };

  const brb=$('#bRoomBlock'); if(brb) brb.onclick=()=>{
    const c=Sync.cfg||{};
    const blk='const ROOM = {\n'+
      '  databaseURL: "'+(c.databaseURL||'')+'",\n'+
      '  apiKey:      "'+(c.apiKey||'')+'",\n'+
      '  projectId:   "'+(c.projectId||'')+'",\n'+
      '  roomName:    "'+(Sync.room||'2026')+'"\n'+
      '};';
    const ok = !!c.databaseURL;
    modal('<h3>Paste this into the file</h3>'+
      '<p>'+(ok
        ? 'Replace the ROOM block near the top of index.html with this, then commit. After that everyone who opens the link joins automatically, with no setup on their end.'
        : 'This device has no database address stored, so there is nothing to copy. Connect to the room first, or get the config from your Firebase console.')+'</p>'+
      '<textarea rows="7" readonly onclick="this.select()">'+esc(blk)+'</textarea>'+
      '<div class="row"><button class="btn" data-x>Close</button>'+
      (ok?'<button class="btn key" id="rbCopy">Copy</button>':'')+'</div>');
    const rc=$('#rbCopy'); if(rc) rc.onclick=()=>{
      if(navigator.clipboard&&navigator.clipboard.writeText)
        navigator.clipboard.writeText(blk).then(()=>{closeM();toast('Copied, now paste it into the file');});
      else { $('.modal textarea').select(); toast('Select and copy the text'); }
    };
  };

  const biv=$('#bInvite'); if(biv) biv.onclick=invite;
  const bto=$('#bTakeover'); if(bto) bto.onclick=()=>{
    modal('<h3>Take over as commissioner</h3><p>Only do this if you are actually running the draft. It moves the ability to set the order, undo picks and clear the board to this device.</p>'+
      '<div class="row"><button class="btn" data-x>Cancel</button><button class="btn key" id="toGo">Take over</button></div>');
    $('#toGo').onclick=()=>{
      closeM();
      Sync.ref.child('commish').set(myDevice());
      put(LS+'_role_'+Sync.room,'commish');
      toast('You are now the commissioner');
    };
  };
  const blv=$('#bLeave'); if(blv) blv.onclick=()=>{ Sync.leave(); toast('Left the room'); render(); };
  const bl=$('#bLock'); if(bl) bl.onchange=e=>{ S.openPick=!e.target.checked; if(Sync.on) Sync.pushMeta(); saveLocal(); render(); };
  const ws=$('#whoSel'); if(ws) ws.onchange=e=>{
    const v=e.target.value;
    if(v===''){ put(LS+'_myteam',''); if(Sync.on) Sync.setClaim(mt,null); }
    else { put(LS+'_myteam',v); if(Sync.on) Sync.setClaim(+v,{dev:myDevice(),who:S.teams[+v].name}); }
    render();
    toast(v===''?'Following along':'Tracking '+S.teams[+v].name);
  };
  $$('[data-claim]').forEach(b=>b.onclick=()=>{
    const t=+b.dataset.claim;
    put(LS+'_myteam',String(t));
    Sync.setClaim(t,{dev:myDevice(),who:S.teams[t].name});
  });
  $$('[data-unclaim]').forEach(b=>b.onclick=()=>{ put(LS+'_myteam',''); Sync.setClaim(+b.dataset.unclaim,null); });
}
function mark(){
  $$('.pr').forEach((r,i)=>r.classList.toggle('sel',i===selIdx));
  const e=$$('.pr')[selIdx]; if(e) e.scrollIntoView({block:'nearest'});
}

/* ---------- 16. BOOT ---------- */
function autoRoom(){
  if(!ROOM || !ROOM.databaseURL) return false;
  const cfg={databaseURL:ROOM.databaseURL};
  if(ROOM.apiKey) cfg.apiKey=ROOM.apiKey;
  if(ROOM.projectId) cfg.projectId=ROOM.projectId;
  const room=(ROOM.roomName||'2026').toUpperCase().replace(/[^A-Z0-9]/g,'')||'2026';
  const go=()=>Sync.start(cfg,room,false,err=>{
    if(err){ toast(err,1); render(); return; }
    render();
  });
  if(Sync.ready()) go(); else setTimeout(go,1400);
  return true;
}

function boot(){
  applyTheme(theme());
  S = loadLocal() || blank();
  if(!S.claims) S.claims={};
  if(!S.order||S.order.length!==S.teams.length) S.order=S.teams.map((t,i)=>i);
  POOL = parsePool(S.poolText||DEFAULT_POOL);
  view = S.started?'draft':'setup';
  resetClock(); render();
  loadRoster();

  $('#bTheme').onclick=flipTheme;
  $('#bClock').onclick=()=>{ if(!S.started){toast('Start the draft first',1);return;} clock.run?stopClock():startClock(); };
  $('#bUndo').onclick=undo;

  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeM();
    if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)) return;
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'){e.preventDefault();undo();return;}
    if(e.key==='/'){e.preventDefault();view='draft';render();const q=$('#q');if(q)q.focus();}
  });

  // A room baked into the file wins: everyone lands straight in it.
  if(autoRoom()) return;

  // auto-join from an invite link
  if(location.hash.startsWith('#j=')){
    try{
      const raw=location.hash.slice(3).replace(/-/g,'+').replace(/_/g,'/');
      const j=JSON.parse(decodeURIComponent(escape(atob(raw))));
      history.replaceState(null,'',location.pathname);
      const go=()=>Sync.start(j.c,j.r,false,err=>{ if(err){toast(err,1);return;} toast('Connected to room '+j.r); render(); });
      if(Sync.ready()) go(); else setTimeout(go,1200);
    }catch(e){}
  } else {
    // rejoin the room this device was last in
    const room=get(LS+'_room'), cfgs=get(LS+'_cfg');
    if(room&&cfgs){
      try{
        const cfg=JSON.parse(cfgs);
        const go=()=>Sync.start(cfg,room,get(LS+'_role_'+room)==='commish',()=>render());
        if(Sync.ready()) go(); else setTimeout(go,1200);
      }catch(e){}
    }
  }
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
